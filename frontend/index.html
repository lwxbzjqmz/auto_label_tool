<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <title>Auto Label Tool</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <div class="app">
        <header class="top-bar">
            <h1>自动标注工具</h1>

            <button id="refreshBtn">刷新图片列表</button>

            <span class="split-btn-group">
                <button id="yoloDetectBtn" class="btn-primary split-btn-main">YOLO标注</button>
                <button id="yoloModelDropdownBtn" class="btn-primary split-btn-arrow" title="切换模型">▾</button>
                <ul id="yoloModelDropdown" class="dropdown-menu hidden"></ul>
            </span>
            <button id="groundingDinoDetectBtn" class="btn-accent">Grounding DINO标注</button>

            <button id="saveXmlBtn" class="btn-primary">保存 XML</button>
            <button id="deleteBoxBtn" class="btn-danger">删除选中框</button>
            <button id="clearBoxesBtn" class="btn-danger">清空所有框</button>
            <button id="backupAnnotationsBtn">备份</button>
            <button id="openPreviewWallBtn">图片预览墙</button>
            <button id="rejectImageBtn" class="btn-danger">移入废弃区</button>
        </header>

        <main class="main-layout">
            <aside class="left-panel">
                <div class="image-list-header">
                    <h2>图片列表</h2>

                    <input
                        id="imageSearchInput"
                        class="image-search"
                        placeholder="搜索图片名，例如 03598"
                    >

                    <div id="imageCount">图片数量：0</div>
                </div>

                <ul id="imageList"></ul>
            </aside>

            <section class="center-panel">
                <h2>图片标注区</h2>

                <div class="canvas-box">
                    <canvas id="imageCanvas"></canvas>
                </div>
            </section>

            <aside class="right-panel">
                <h2>当前信息</h2>
                <p id="currentImageName">当前图片：无</p>
                <p id="statusText">状态：等待加载图片</p>

                <h2>坐标列表</h2>
                <div id="boxCount">框数量：0</div>
                <ul id="boxList"></ul>

                <h2>Grounding DINO 参数</h2>

                <div class="grounding-config">
                    <label>
                        提示词
                        <textarea id="groundingPromptInput" rows="5">tennis ball. blue bean bag without black. red bean bag. white teddy bear. brown teddy bear</textarea>
                    </label>

                    <label>
                        Box阈值
                        <input
                            id="groundingBoxThresholdInput"
                            type="number"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.18"
                        >
                    </label>

                    <label>
                        Text阈值
                        <input
                            id="groundingTextThresholdInput"
                            type="number"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.20"
                        >
                    </label>

                    <label class="checkbox-label">
                        <input id="groundingUseNmsInput" type="checkbox" checked>
                        启用 NMS
                    </label>

                    <label>
                        NMS IoU阈值
                        <input
                            id="groundingNmsIouInput"
                            type="number"
                            min="0"
                            max="1"
                            step="0.05"
                            value="0.20"
                        >
                    </label>
                </div>
                <h2>快捷键设置</h2>

                <div class="shortcut-config">
                    <label>
                        上一张
                        <input id="shortcutPreviousImageInput" type="text" readonly>
                    </label>

                    <label>
                        下一张
                        <input id="shortcutNextImageInput" type="text" readonly>
                    </label>

                    <label>
                        保存 XML
                        <input id="shortcutSaveXmlInput" type="text" readonly>
                    </label>

                    <label>
                        保存并上一张
                        <input id="shortcutSavePreviousImageInput" type="text" readonly>
                    </label>

                    <label>
                        保存并下一张
                        <input id="shortcutSaveNextImageInput" type="text" readonly>
                    </label>

                    <label>
                        YOLO 标注
                        <input id="shortcutYoloDetectInput" type="text" readonly>
                    </label>

                    <label>
                        Grounding DINO 标注
                        <input id="shortcutGroundingDinoDetectInput" type="text" readonly>
                    </label>

                    <label>
                        删除框
                        <input id="shortcutDeleteBoxInput" type="text" readonly>
                    </label>

                    <label>
                        清空框
                        <input id="shortcutClearBoxesInput" type="text" readonly>
                    </label>

                    <label>
                        重新读取 XML
                        <input id="shortcutReloadAnnotationInput" type="text" readonly>
                    </label>

                    <label>
                        取消选中
                        <input id="shortcutCancelSelectInput" type="text" readonly>
                    </label>

                    <label>
                        移入废弃区
                        <input id="shortcutRejectImageInput" type="text" readonly>
                    </label>

                    <div class="shortcut-config-hint">
                        点击输入框后，按下想设置的按键。1-9 固定用于选择第几个框。
                    </div>

                    <div class="shortcut-config-buttons">
                        <button id="saveShortcutConfigBtn">保存快捷键</button>
                        <button id="resetShortcutConfigBtn">恢复默认</button>
                    </div>
                </div>
            </aside>
        </main>
            <section id="previewWallView" class="preview-wall-view hidden">
                <div class="preview-wall-topbar">
                    <h2>图片预览墙</h2>

                    <div class="preview-wall-controls">
                        <input id="previewWallSearchInput" placeholder="搜索图片名，例如 03598">

                        <input type="range" id="previewWallZoomSlider" class="preview-wall-zoom-slider"
                               min="0.4" max="2.5" step="0.1" value="1.0" title="缩略图缩放">
                        <span id="previewWallZoomLabel" class="preview-wall-zoom-label">100%</span>

                        <button id="previewWallRefreshBtn">刷新预览</button>
                        <button id="backToLabelViewBtn">返回标注页面</button>
                    </div>
                </div>

                <div id="previewWallGrid" class="preview-wall-grid"></div>
            </section>
            </div>

    </div>

    <script src="/frontend/main.js"></script>
</body>
</html>
